<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds — Feedback Prototype 8</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <!--
    This prototype tests whether a brief maraca-like shake on every note makes
    the repeating musical rhythm easier to understand.
    -->
    <main class="prototype">
        <header class="intro">
            <p class="eyebrow">GARDEN OF SOUNDS</p>
            <h1>Feedback Prototype 8</h1>
            <p id="instruction">Tap the flower to start or stop its rhythm.</p>
        </header>

        <section class="garden" aria-label="Garden canvas">
            <button
                id="flower"
                class="flower"
                type="button"
                aria-pressed="false"
                aria-label="Toggle flower rhythm"
                aria-describedby="instruction"
            >
                <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
                    <g fill="currentColor">
                        <circle cx="60" cy="29" r="20" />
                        <circle cx="89" cy="50" r="20" />
                        <circle cx="78" cy="84" r="20" />
                        <circle cx="42" cy="84" r="20" />
                        <circle cx="31" cy="50" r="20" />
                        <circle cx="60" cy="60" r="17" fill="#f7cb5c" />
                    </g>
                </svg>
            </button>
        </section>

        <p id="sound-status" class="soundStatus" role="status" aria-atomic="true"></p>
        <noscript>Enable JavaScript to play the flower rhythm.</noscript>
    </main>
</body>
</html>
